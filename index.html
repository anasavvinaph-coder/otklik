<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<meta name="description" content="Русскоязычный смысловой поиск книг, фильмов и картин по всему открытому вебу.">
<title>Отклик — искусство вместо ответа</title>
<style>
:root {--paper:#faf9f6;--ink:#20201f;--gray:#74746f;--faint:#a7a69f;--rule:#deddd8;--blank:#ecebe6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);margin:0;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
::selection{background:#dbd9ce}
.container{width:min(100% - 72px,1160px);margin-inline:auto}
.header{display:flex;align-items:center;justify-content:space-between;height:88px;border-bottom:1px solid var(--rule)}
.brand{font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1;letter-spacing:-.065em;white-space:nowrap;background:none;border:0;padding:0;color:var(--ink);font-weight:500}.brand span{margin-left:1px}
.header-note{font-size:12px;color:var(--gray);letter-spacing:.012em}
.page{min-height:calc(100svh - 140px)}
.hero{min-height:calc(100svh - 140px);display:flex;align-items:center;justify-content:center;padding:70px 0 90px;transition:min-height .25s,padding .25s}
.hero-inner{width:min(100%,830px);text-align:center}
.eyebrow,.overline{color:var(--gray);letter-spacing:.155em;text-transform:uppercase;font-size:10px;font-weight:600}
.hero h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(48px,6.7vw,84px);letter-spacing:-.061em;line-height:1.105;margin:27px 0 29px}
.hero-copy{font-size:15px;line-height:1.75;color:var(--gray);max-width:480px;margin:0 auto 46px}
.main-form{display:flex;align-items:center;border-bottom:1px solid var(--ink);width:min(100%,735px);margin:0 auto;gap:16px;padding:0 0 7px}
.main-form input{height:62px;min-width:0;flex:1;border:0;background:transparent;color:var(--ink);font-size:20px;letter-spacing:-.025em;outline:0!important}
.main-form input::placeholder{color:#9a9993}
.main-form button{width:48px;height:48px;flex:0 0 48px;border:0;background:var(--ink);color:var(--paper);font-size:24px;display:grid;place-items:center;transition:background .15s,transform .15s}
.main-form button:hover{background:#484842;transform:translateX(2px)}
.main-form button:disabled{opacity:.6;cursor:default;transform:none}
.examples{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 20px;margin-top:22px}
.examples button{color:var(--gray);border:0;border-bottom:1px solid transparent;padding:2px 0;background:transparent;font-size:12px}
.examples button:hover{border-color:var(--gray);color:var(--ink)}
.results{display:none;padding-bottom:100px;animation:fade .25s ease}
@keyframes fade{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}
body.searched .hero{min-height:0;justify-content:start;padding:44px 0 42px}
body.searched .hero-inner{max-width:none;width:100%;text-align:left}
body.searched .hero h1{font-size:39px;margin:12px 0 19px;line-height:1.19}
body.searched .hero-copy,body.searched .examples{display:none}
body.searched .main-form{margin:0;width:min(100%,680px)}
body.searched .main-form input{height:46px;font-size:16px}
body.searched .main-form button{width:42px;height:42px;flex-basis:42px;font-size:20px}
body.searched .results{display:block}
.results-head{border-top:1px solid var(--rule);padding:38px 0 24px}
.result-state{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.result-state .status{color:var(--gray);font-size:11px}
.results-head h2{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(38px,4.6vw,60px);letter-spacing:-.052em;line-height:1.15;margin:17px 0 12px;overflow-wrap:anywhere}
.results-head p{margin:0;color:var(--gray);font-size:14px;line-height:1.6;max-width:730px}
.refine{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:24px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:21px 0;margin:20px 0 26px}
.refine label{font-family:Georgia,'Times New Roman',serif;font-size:23px;letter-spacing:-.04em}
.refine-form{display:flex;gap:12px;align-items:center;min-width:0}
.refine-form input{min-width:0;flex:1;border:0;outline:0!important;color:var(--ink);background:transparent;font-size:14px;padding:12px 0}
.refine-form input::placeholder{color:#a09f98}
.refine-form button{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:12px 16px;font-size:12px;white-space:nowrap;transition:background .2s,color .2s}
.refine-form button:hover{background:var(--ink);color:#fff}
.refinement-active{display:none;margin:-7px 0 20px;font-size:12px;color:var(--gray)}
.refinement-active.show{display:flex;align-items:center;gap:10px}
.refinement-active strong{font-weight:400;color:var(--ink)}
.refinement-active button{background:transparent;border:0;border-bottom:1px solid #8b8a84;color:#777;font-size:12px;padding:1px 0}
.tabs{display:flex;align-items:center;gap:26px;margin-top:4px;padding:0 0 18px;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;color:var(--gray);font-size:13px;padding:8px 0;border-bottom:1px solid transparent;white-space:nowrap}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{color:var(--ink)}
.total{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.work-grid{display:block;max-width:860px}
.work{display:grid;grid-template-columns:54px minmax(0,1fr);gap:24px;min-width:0;padding:26px 0 29px;border-bottom:1px solid var(--rule)}
.work-number{font-family:Georgia,'Times New Roman',serif;font-size:19px;color:#a7a69f;line-height:1.4;font-variant-numeric:tabular-nums}
.work-type{color:var(--gray);font-size:10px;letter-spacing:.11em;text-transform:uppercase;margin:3px 0 17px}
.work h3{font-family:Georgia,'Times New Roman',serif;font-size:clamp(19px,2.05vw,24px);font-weight:400;letter-spacing:-.032em;line-height:1.17;margin:0 0 10px}
.work-author{color:var(--gray);font-size:12px;line-height:1.4;margin:0 0 15px}
.work-why{font-size:13px;line-height:1.55;margin:0 0 16px;color:#4c4c49}
.work-link{font-size:11px;color:var(--ink);text-decoration:none;border-bottom:1px solid #aaa9a0;padding-bottom:3px;display:inline-block}
.work-link:hover{border-color:var(--ink)}
.disclaimer{font-size:11px;color:#95938d;line-height:1.6;margin:32px 0 0}
.empty,.loading{font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.5;color:var(--gray);padding:50px 0}
.empty p{font-family:Arial,Helvetica,sans-serif;font-size:13px;margin-top:15px;max-width:550px}
.loading:after{content:' ';display:inline-block;width:16px;height:1px;vertical-align:middle;margin-left:8px;background:var(--gray);animation:load 1s linear infinite alternate}
@keyframes load{to{width:48px}}
.footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--rule);padding:24px 0 27px;color:var(--gray);font-size:11px}
.footer a{text-decoration:none;border-bottom:1px solid #b9b7af}
.footer a:hover{color:var(--ink)}
@media (max-width:850px){.container{width:min(100% - 42px,1160px)}.hero h1{font-size:clamp(49px,7vw,66px)}}
@media (max-width:540px){.container{width:calc(100% - 38px)}.header{height:70px}.header-note{font-size:10px;max-width:145px;text-align:right;line-height:1.4}.brand{font-size:25px}.page{min-height:calc(100svh - 123px)}.hero{min-height:calc(100svh - 124px);padding:54px 0 76px}.hero h1{font-size:clamp(46px,12.6vw,63px);line-height:1.13;margin:20px 0 22px}.hero-copy{font-size:13px;line-height:1.65;margin-bottom:40px}.main-form input{font-size:16px;height:55px}.main-form button{width:42px;flex-basis:42px;height:42px}.examples{justify-content:flex-start;gap:11px 18px;text-align:left}.examples button{font-size:11px}.hero-inner{text-align:left}.eyebrow{font-size:10px}body.searched .hero{padding:27px 0 28px}body.searched .hero h1{font-size:30px}body.searched .main-form input{font-size:14px}.results-head{padding:28px 0 18px}.results-head h2{font-size:43px;margin:14px 0 10px}.results-head p{font-size:13px}.refine{display:block;padding:17px 0;margin:15px 0 17px}.refine label{font-size:21px;display:block;margin-bottom:4px}.refine-form{gap:8px}.refine-form input{font-size:13px}.refine-form button{padding:10px 13px}.tabs{gap:20px;overflow:auto;padding-bottom:11px}.tab{font-size:12px}.total{display:none}.work{padding:23px 0;grid-template-columns:31px minmax(0,1fr);gap:12px}.work-number{font-size:15px}.work-type{font-size:9px;margin:2px 0 10px}.work h3{font-size:20px;margin-bottom:7px}.work-author{font-size:11px;margin-bottom:10px}.work-why{font-size:12px;line-height:1.5;margin-bottom:11px}.work-link{font-size:10px}.footer{flex-direction:column;gap:8px;font-size:10px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="container">
  <header class="header"><button class="brand" id="home" aria-label="На главную">отклик<span>.</span></button><span class="header-note">Искусство как способ понять</span></header>
  <main class="page">
    <section class="hero" id="hero"><div class="hero-inner">
      <div class="eyebrow">Смысловой поиск в интернете</div>
      <h1>О чём ты хочешь<br>подумать?</h1>
      <p class="hero-copy">Ищем книги, фильмы и картины по смыслу вопроса, используя интернет. Без обложек, без персонализации.</p>
      <form class="main-form" id="search-form">
        <input id="query" aria-label="Вопрос или тема для поиска" placeholder="Например, что такое совесть?" autocomplete="off" maxlength="300" required>
        <button type="submit" id="search-button" aria-label="Найти">→</button>
      </form>
      <div class="examples" aria-label="Примеры запросов"><button type="button" data-query="Что такое совесть?">Что такое совесть?</button><button type="button" data-query="Я застрял в жизни">Я застрял в жизни</button><button type="button" data-query="Париж">Париж</button><button type="button" data-query="Одиночество">Одиночество</button><button type="button" data-query="Можно ли оправдать ложь?">Можно ли оправдать ложь?</button></div>
    </div></section>
    <section class="results" id="results" aria-live="polite">
      <div class="results-head"><div class="result-state"><span class="overline">Произведения и смыслы</span><span id="mode-indicator" class="status"></span></div>
        <h2 id="results-query"></h2><p id="results-intro"></p>
      </div>
      <div class="refine"><label for="refine-input">Уточнить</label><form id="refine-form" class="refine-form"><input id="refine-input" aria-label="Уточнить поиск" placeholder="Например, больше о свободе или только фильмы" maxlength="240"><button id="refine-button" type="submit">Уточнить →</button></form></div>
      <div class="refinement-active" id="active-refine"><span>Уточнение: <strong id="refine-label"></strong></span><button id="refine-reset" type="button">сбросить ×</button></div>
      <nav class="tabs" aria-label="Виды искусства"><button class="tab active" data-type="all">Все</button><button class="tab" data-type="book">Книги</button><button class="tab" data-type="film">Фильмы</button><button class="tab" data-type="painting">Картины</button><span class="total" id="total"></span></nav>
      <div id="work-grid" class="work-grid"></div>
      <div class="disclaimer" id="disclaimer"></div>
    </section>
  </main>
  <footer class="footer"><span>Отклик — искусство как способ исследовать вопрос. Русскоязычный поиск.</span><span></span></footer>
</div>
<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
